<ui:composition template="/WEB-INF/templates/page_template_default_impl.xhtml" xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui"
                xmlns:o="http://omnifaces.org/ui" xmlns:custom="http://java.sun.com/jsf/composite/components">

    <f:metadata>
        <f:viewAction action="#{pidBacking.initOrReload}" onPostback="false"/>
    </f:metadata>

    <ui:define name="RemoComponent">

        <o:importConstants type="com.remo.core.control.pid.model.PidMode"/>
        <o:importConstants type="com.remo.core.control.pid.model.PidDirection"/>

        <div class="col-sm-4">
            <div class="panel panel-warning">
                <div class="panel-heading">New Pid definition</div>
                <div class="panel-body">
                    <!--****************************************Transfer function form****************************************-->
                    <h:form id="pid-form" prependId="false" class="form-horizontal" role="form">
                        <h:panelGroup id="pid-panel-group-wrapper" class="row" layout="block">

                            <div class="form-group">
                                <div class="col-sm-offset-2 col-sm-8">
                                    <p:inputText id="pp-gain" value="#{pidBacking.pid.pidParams.kp}"
                                                 styleClass="form-control" required="true"
                                                 requiredMessage="Gain required">
                                        <f:validateDoubleRange minimum="0.0"/>
                                    </p:inputText>
                                    <p:watermark value="Gain" for="pp-gain"/>
                                    <h:message id="pp-gain-message" for="pp-gain" styleClass="validation-input"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="col-sm-offset-2 col-sm-8">
                                    <p:inputText id="pp-integr" value="#{pidBacking.pid.pidParams.ki}"
                                                 styleClass="form-control" required="true"
                                                 requiredMessage="Integral required">
                                        <f:validateDoubleRange minimum="0.0"/>

                                    </p:inputText>
                                    <p:watermark value="Integral" for="pp-integr"/>
                                    <h:message id="pp-ki-message" for="pp-integr" styleClass="validation-input"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="col-sm-offset-2 col-sm-8">
                                    <p:inputText id="pp-kd" value="#{pidBacking.pid.pidParams.kd}"
                                                 styleClass="form-control" required="true"
                                                 requiredMessage="Derivative required">
                                        <f:validateDoubleRange minimum="0.0"/>
                                    </p:inputText>
                                    <p:watermark value="Derivative" for="pp-kd"/>
                                    <h:message id="pp-kd-message" for="pp-kd" styleClass="validation-input"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <!--<h:outputLabel value="Mode:" for="pid-mode" styleClass="col-sm-2 control-label" />-->

                                <div class="col-sm-offset-2 col-sm-8">
                                    <h:selectOneMenu id="pid-mode" styleClass="form-control"
                                                     value="#{pidBacking.pid.pidMode}" required="true"
                                                     requiredMessage="Please select a mode" layout="pageDirection"
                                                     converter="omnifaces.GenericEnumConverter">
                                        <f:selectItems value="#{PidMode}"/>
                                    </h:selectOneMenu>
                                    <h:message for="pid-mode" styleClass="validation-input"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <!--<h:outputLabel value="Dir:" for="pid-settings" styleClass="col-sm-2 control-label" />-->

                                <div class="col-sm-offset-2 col-sm-8">
                                    <h:selectOneMenu id="pid-direction" styleClass="form-control"
                                                     value="#{pidBacking.pid.pidDirection}" required="true"
                                                     requiredMessage="Please select a direction" layout="pageDirection"
                                                     converter="omnifaces.GenericEnumConverter">
                                        <f:selectItems value="#{PidDirection}"/>
                                    </h:selectOneMenu>
                                    <h:message for="pid-direction" styleClass="validation-input"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="col-sm-offset-2 col-sm-8">
                                    <h:outputText id="pid-output-range"
                                                  value="Pid output: #{pidBacking.pid.pidOutputRange.minRange} to #{pidBacking.pid.pidOutputRange.maxRange}"/>
                                    <p:slider for="txt6,txt7" display="pid-output-range" range="true"
                                              displayTemplate="{min} to {max}" minValue="0" maxValue="255"/>
                                    <h:inputHidden id="txt6" value="#{pidBacking.pid.pidOutputRange.minRange}"/>
                                    <h:inputHidden id="txt7" value="#{pidBacking.pid.pidOutputRange.maxRange}"/>
                                    <h:message for="pid-output-range" styleClass="validation-input"/>
                                </div>
                            </div>

                            <div class="form-group">
                                <div class="col-sm-offset-2 col-sm-8">
                                    <p:commandButton value="Add PID"
                                                     actionListener="#{pidBacking.submitForm()}"
                                                     update=":pid-form:pid-panel-group-wrapper :existing-pids-wrapper"
                                                     styleClass="btn btn-block btn-primary btn-xs"/>
                                </div>
                            </div>
                        </h:panelGroup>
                    </h:form>
                </div>
            </div>
        </div>

        <div class="col-sm-8">
            <h:panelGroup id="existing-pids-wrapper" class="panel panel-warning" layout="block">
                <div class="panel-heading">Existing PIDS</div>
                <div class="panel-body">
                    <div class="panel panel-default">
                        <div class="panel-body">
                            <custom:pidsList pids="#{pidBacking.pids}"></custom:pidsList>
                        </div>
                    </div>
                </div>
            </h:panelGroup>
        </div>
    </ui:define>

</ui:composition>
