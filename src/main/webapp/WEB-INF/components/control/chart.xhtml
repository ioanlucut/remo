<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui">

    <!--****************************************Chart************************************-->

    <h:form id="chart-form" prependId="false">

        <p:chart id="chart-component" type="line" model="#{guiBacking.synchronizeWithGui()}"
                 style="width:100%;height:500px;" widgetVar="chart"/>

        <p:poll id="poll" interval="#{guiBacking.pidSampleSeconds}"
                update=":chart-op-panel-settings :chart-form:chart-component :control-options-display"
                stop="#{not guiBacking.pollingStarted}"/>

        <!--    <p:remoteCommand name="stopPollingDueToBrowserBlur" update=":chart-form: :chart-form:chart-component :chart-form:poll chart-op-form: :chart-op-form:chart-op-panel-group-wrapper"
                             actionListener="#{guiBacking.stopPollingDueToBrowserBlur()}" />

            <p:remoteCommand name="startPollingDueToTabSwitchFocus"
                             update=":chart-form: :chart-form:chart-component :chart-form:poll :chart-op-form:chart-op-panel-group-wrapper"
                             actionListener="#{guiBacking.startPollingDueToTabSwitchFocus()}" />-->
    </h:form>

</ui:composition>
