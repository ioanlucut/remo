<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core">

    <!--****************************************Control settings form************************************-->

    <h:form id="control-settings-form" prependId="false" class="form-horizontal" role="form">

        <h:panelGroup id="control-settings-panel-group-wrapper" layout="block">

            <div class="form-group">
                <div class="col-sm-12">
                    <!--START/STOP PID-->
                    <p:commandButton id="start-service" actionListener="#{guiBacking.stopService}" value="Stop PID"
                                     icon="ui-icon-pause" styleClass="btn btn-block btn-danger btn-xs"
                                     update=":chart-form :control-settings-form:control-settings-panel-group-wrapper :control-options-display"
                                     rendered="#{guiBacking.serviceStarted}"
                                     process="start-service">
                    </p:commandButton>
                    <p:commandButton id="stop-service" actionListener="#{guiBacking.startService}" value="Start PID"
                                     icon="ui-icon-play" styleClass="btn btn-block btn-success btn-xs"
                                     update=":chart-form :control-settings-form:control-settings-panel-group-wrapper :control-options-display"
                                     rendered="#{not guiBacking.serviceStarted}"
                                     process="stop-service">
                    </p:commandButton>

                </div>

            </div>

            <!--Setpoint Input-->
            <div class="form-group">
                <div class="col-sm-6">
                    <p:inputText id="setPoint"
                                 value="#{guiBacking.pidController.setPoint}"
                                 styleClass="form-control" required="true"
                                 requiredMessage="Please provide a proper setPoint">
                        <f:validateDoubleRange minimum="0.0" maximum="100.0"/>
                    </p:inputText>
                    <p:watermark value="Setpoint" for="setPoint"/>
                    <h:message id="setPoint-message" for="setPoint"
                               styleClass="validation-input"/>
                </div>
                <!--Submit button-->
                <div class="col-sm-6">
                    <p:commandButton value="Update SetPoint"
                                     actionListener="#{guiBacking.submitSetPoint()}"
                                     update=":control-settings-form:control-settings-panel-group-wrapper"
                                     oncomplete="slideToSuccessfulOrErrorMessage(xhr, status, args, '.validation-input', '.page-header.header-div')"
                                     styleClass="btn btn-block btn-primary btn-xs"
                                     process="control-settings-panel-group-wrapper"/>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-12 text-center">
                    <p:commandButton id="start-installation" actionListener="#{guiBacking.startInstallation()}" value=""
                                     styleClass="btn btn-block btn-success btn-xs"
                                     update=":chart-form
                                     :control-settings-form:control-settings-panel-group-wrapper
                                     :control-options-display
                                     :chart-op-form:chart-op-panel-group-wrapper
                                     :pid-selected-values
                                     :tf-selected-values
                                     :select-pid-form
                                     :pid-form:overlay-panel-pid
                                     :pid-form:define-pid-overlay
                                     :select-tf-form
                                     :transfer-function-form:overlay-panel-transfer-function
                                     :transfer-function-form:define-transfer-function-overlay"
                                     rendered="#{not guiBacking.installationStarted}"
                                     process="start-installation">
                    </p:commandButton>
                    <p:commandButton id="stop-installation" actionListener="#{guiBacking.stopInstallation()}" value=""
                                     styleClass="btn btn-block btn-danger btn-xs"
                                     update=":chart-form
                                              :control-settings-form:control-settings-panel-group-wrapper
                                              :control-options-display
                                              :chart-op-form:chart-op-panel-group-wrapper
                                              :pid-selected-values
                                              :tf-selected-values
                                              :select-pid-form
                                              :pid-form:overlay-panel-pid
                                              :pid-form:define-pid-overlay
                                              :select-tf-form
                                              :transfer-function-form:overlay-panel-transfer-function
                                              :transfer-function-form:define-transfer-function-overlay"
                                     rendered="#{guiBacking.installationStarted}"
                                     process="stop-installation">
                    </p:commandButton>
                </div>
            </div>

        </h:panelGroup>

    </h:form>

</ui:composition>
