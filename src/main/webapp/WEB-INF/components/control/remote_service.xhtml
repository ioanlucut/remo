<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:c="http://java.sun.com/jstl/core">

    <!--****************************************REMOTE SERVICES************************************-->

    <h:panelGroup id="control-options-display" layout="block">
        <div class="row">
            <div class="col-sm-6">
                <div class="panel panel-default text-center">
                    <h:panelGroup id="cmd-status-connection" layout="block"
                                  styleClass="panel-body #{guiBacking.isRemoteConsumerConnectionEstablished() ? 'alert-success' : 'alert-danger'}">
                        <strong>CMD remote service</strong>
                        <c:choose>
                            <c:when test="${guiBacking.isRemoteConsumerConnectionEstablished()}">
                                <i class="fa fa-2x fa-cog fa-spin pull-right"></i>
                            </c:when>
                            <c:otherwise>
                                <i class="fa fa-2x fa-square pull-right"></i>
                            </c:otherwise>
                        </c:choose>
                    </h:panelGroup>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="panel panel-default text-center">
                    <h:panelGroup id="pv-status-connection" layout="block"
                                  styleClass="panel-body #{guiBacking.isRemoteSensorConnectionEstablished()  ? 'alert-success' : 'alert-danger'}">
                        <strong>PV remote service</strong>
                        <c:choose>
                            <c:when test="${guiBacking.isRemoteSensorConnectionEstablished()}">
                                <i class="fa fa-2x fa-cog fa-spin pull-right"></i>
                            </c:when>
                            <c:otherwise>
                                <i class="fa fa-2x fa-square pull-right"></i>
                            </c:otherwise>
                        </c:choose>
                    </h:panelGroup>
                </div>
            </div>
        </div>
    </h:panelGroup>
</ui:composition>
