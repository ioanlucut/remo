<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://java.sun.com/jsf/core"
              xmlns:cc="http://java.sun.com/jsf/composite"
              xmlns:ui="http://java.sun.com/jsf/facelets"
              xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="menuId" type="java.lang.String" required="true"/>
        <cc:attribute name="tfEntry" type="com.remo.core.control.tf.model.TransferFunction" required="true"/>
        <cc:attribute name="selectFromTfs" type="java.util.List" required="true"/>
    </cc:interface>

    <cc:implementation>

        <p:selectOneMenu id="#{cc.attrs.menuId}" value="#{cc.attrs.tfEntry}" required="true"
                         requiredMessage="Please select a Transfer Function">
            <f:converter binding="#{transferFunctionConverter}"/>
            <f:selectItem itemLabel="Select one Transfer Function" itemValue=""/>
            <f:selectItems value="#{cc.attrs.selectFromTfs}" var="transferFunction" itemValue="#{transferFunction}"
                           itemLabel="TF: Id=#{transferFunction.id}; G=#{transferFunction.gainK}; T=#{transferFunction.timeConstantT}; D=#{transferFunction.delayL};"/>
        </p:selectOneMenu>

    </cc:implementation>

</ui:component>
