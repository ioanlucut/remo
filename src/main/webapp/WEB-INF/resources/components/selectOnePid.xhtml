<ui:component xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://java.sun.com/jsf/core"
              xmlns:cc="http://java.sun.com/jsf/composite"
              xmlns:ui="http://java.sun.com/jsf/facelets"
              xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="menuId" type="java.lang.String" required="true"/>
        <cc:attribute name="pidEntry" type="com.remo.core.control.pid.model.Pid" required="true"/>
        <cc:attribute name="selectFromPids" type="java.util.List" required="true"/>
    </cc:interface>

    <cc:implementation>

        <p:selectOneMenu id="#{cc.attrs.menuId}" value="#{cc.attrs.pidEntry}" required="true"
                         requiredMessage="Please select a PID">
            <f:converter binding="#{pidConverter}"/>
            <f:selectItem itemLabel="Select one PID" itemValue=""/>
            <f:selectItems value="#{cc.attrs.selectFromPids}" var="pid" itemValue="#{pid}"
                           itemLabel="PID: Id=#{pid.id}; P=#{pid.pidParams.kp}; I=#{pid.pidParams.ki}; D=#{pid.pidParams.kd};"/>
        </p:selectOneMenu>

    </cc:implementation>

</ui:component>
