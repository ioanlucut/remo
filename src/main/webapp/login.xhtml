<ui:composition template="/WEB-INF/templates/main_page_template.xhtml" xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:p="http://primefaces.org/ui">

    <!-- Login form -->
    <ui:define name="content">

        <h:form id="login-form" prependId="false" class="form-horizontal" role="form">
            <div class="col-sm-offset-4 col-sm-4">
                <p:messages id="messages-admin-login" showDetail="true" autoUpdate="true" closable="true"
                            globalOnly="true"/>
            </div>

            <div class="form-group">
                <div class="col-sm-offset-4 col-sm-4">
                    <p:inputText id="adminUserName" value="#{loginBacking.email}" styleClass="form-control"
                                 required="true" requiredMessage="Please provide a username"/>
                    <p:watermark value="username" for="adminUserName"/>
                    <h:message for="adminUserName" styleClass="validation-input"/>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-offset-4 col-sm-4">
                    <p:password id="adminPassword" value="#{loginBacking.password}" styleClass="form-control"
                                required="true" requiredMessage="Please provide a password"/>
                    <p:watermark value="password" for="adminPassword"/>
                    <h:message for="adminPassword" styleClass="validation-input"/>
                </div>
            </div>

            <div class="form-group">
                <div class="col-sm-offset-4 col-sm-4">
                    <p:commandButton id="adminLoginButton" actionListener="#{loginBacking.submit}" value="Login"
                                     styleClass="btn btn-primary btn-block" update="login-form messages-admin-login"/>
                </div>
            </div>
        </h:form>

    </ui:define>

</ui:composition>
